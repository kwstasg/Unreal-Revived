; Edit the runtime copy in local/game/System64, save, then run ReloadVRWeapons in the game console.
; Scale: 1.0 = shared physical baseline in both modes, 1.2 = 20% larger.
; Offsets are centimetres in weapon/view axes: X forward, Y right, Z up.
; Negative X/Y/Z moves backward/left/down in right-hand gaze and controller-local motion.
; Gaze Y uses right-hand calibration: mirrored for left hand, zero for center.
; Motion offsets are not auto-mirrored. Gaze X/Z and Scale are unchanged by hand.
; Both modes move mesh and muzzle for all stock/UPak weapon profiles below.
; Old Weapons inherits its base weapon entry unless given an exact class entry.
; Duplicate entries: the first entry for a class wins. Missing entries are neutral.

